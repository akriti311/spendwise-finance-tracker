{% extends 'tracker/base.html' %}

{% block title %}Login - SpendWise{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>Log in to SpendWise</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <p class="help">
        Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>.
    </p>
</div>
{% endblock %}
